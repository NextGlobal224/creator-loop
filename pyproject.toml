[project]
name = "creator-loop"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
ui = ["PySide6==6.10.2"]
build = ["PyInstaller==6.16.0"]

[tool.setuptools.packages.find]
where = ["app"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
