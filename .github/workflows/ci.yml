name: Creator Loop CI
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  fast:
    name: fast-schema-domain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node 24)
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0 (Node 24)
        with:
          python-version: '3.12'
      - name: Install pinned quality tools
        run: python -m pip install ruff==0.16.9 mypy==2.3.1
      - name: Lint, format, type check
        run: |
          ruff check app tests scripts
          ruff format --check app tests scripts
          mypy app/creator_loop
      - name: Compile and test
        env:
          PYTHONPATH: app
        run: |
          python -m compileall -q app tests
          python -m unittest discover -s tests -v
      - name: Source smoke
        env:
          PYTHONPATH: app
          CREATOR_LOOP_DATA_ROOT: ${{ runner.temp }}/creator-loop-smoke
        run: |
          python -m creator_loop --smoke
          python -m creator_loop --backup
  security:
    name: security-dependencies-workflow
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node 24)
        with:
          fetch-depth: 0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0 (Node 24)
        with:
          python-version: '3.12'
      - name: Audit packaged dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r requirements-release.txt
      - name: Check workflow policy
        run: python scripts/check_workflow_policy.py
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.24.11'
          cache: false
      - name: Scan full Git history for secrets
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" git --redact --log-opts='--all' .
  windows-artifact:
    name: windows-artifact
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node 24)
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0 (Node 24)
        with:
          python-version: '3.12'
      - name: Install pinned packaging dependencies
        run: python -m pip install -r requirements-release.txt
      - name: Tests on Windows
        env:
          PYTHONPATH: app
        shell: powershell
        timeout-minutes: 6
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\run_test_with_timeout.ps1 -Executable python -TimeoutSeconds 300 -CommandArgs @('-u','-m','unittest','discover','-s','tests','-v')
          $testExit = $LASTEXITCODE
          $run = Get-ChildItem .local-test-logs -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if ($run) {
            Get-Content (Join-Path $run.FullName 'result.json')
            Get-Content (Join-Path $run.FullName 'output.log') -Tail 60
          }
          exit $testExit
      - name: Preserve bounded test logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (Node 24)
        with:
          name: creator-loop-windows-test-logs-${{ github.sha }}
          path: .local-test-logs/
          if-no-files-found: error
          include-hidden-files: true
      - name: Build one-directory application
        run: python -m PyInstaller --noconfirm --clean --onedir --name CreatorLoop --paths app --add-data "migrations/0001_initial.sql;migrations" --add-data "migrations/0002_claim_citation_seal.sql;migrations" --add-data "migrations/0003_draft_snapshot_seal.sql;migrations" --add-data "migrations/0004_selection_snapshot_seal.sql;migrations" --add-data "migrations/0005_publication_snapshot_guards.sql;migrations" --add-data "migrations/0006_observation_metric_validation.sql;migrations" packaging/entrypoint.py
      - name: Pack and smoke the exact ZIP
        shell: pwsh
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path dist/CreatorLoop -DestinationPath release/CreatorLoop-${{ github.sha }}-win-x64.zip
          $zip = (Resolve-Path release/CreatorLoop-${{ github.sha }}-win-x64.zip).Path
          $before = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $target = Join-Path $env:RUNNER_TEMP 'thư mục thử có dấu'
          Expand-Archive -Path $zip -DestinationPath $target
          $env:CREATOR_LOOP_DATA_ROOT = Join-Path $env:RUNNER_TEMP 'dữ liệu người dùng'
          & (Join-Path $target 'CreatorLoop/CreatorLoop.exe') --smoke
          if ($LASTEXITCODE -ne 0) { throw 'Extracted artifact smoke failed' }
          & (Join-Path $target 'CreatorLoop/CreatorLoop.exe') --backup
          if ($LASTEXITCODE -ne 0) { throw 'Extracted artifact backup failed' }
          $env:QT_QPA_PLATFORM = 'offscreen'
          & (Join-Path $target 'CreatorLoop/CreatorLoop.exe') --ui-smoke
          if ($LASTEXITCODE -ne 0) { throw 'Extracted UI smoke failed' }
          $after = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($before -ne $after) { throw 'Release ZIP changed after smoke' }
          python scripts/write_release_manifest.py --zip $zip --package (Join-Path $target 'CreatorLoop') --output release/release-manifest.json --commit '${{ github.sha }}' --run-url '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          if ($LASTEXITCODE -ne 0) { throw 'Release manifest validation failed' }
          $installation = Join-Path $env:RUNNER_TEMP 'bản cài đặt theo phiên bản'
          New-Item -ItemType Directory -Force $installation | Out-Null
          & .\scripts\run_test_with_timeout.ps1 -Executable (Join-Path $target 'CreatorLoop/CreatorLoop.exe') -TimeoutSeconds 120 -CommandArgs @('--stage-update',$zip,'--release-manifest',(Join-Path $PWD 'release/release-manifest.json'),'--installation-root',$installation)
          if ($LASTEXITCODE -ne 0) { throw 'Extracted staging command failed' }
          $candidate = Get-ChildItem $installation -Directory | Select-Object -First 1
          if (-not $candidate) { throw 'Verified candidate missing' }
          & .\scripts\run_test_with_timeout.ps1 -Executable (Join-Path $candidate.FullName 'CreatorLoop/CreatorLoop.exe') -TimeoutSeconds 120 -CommandArgs @('--prepare-update',$zip,'--release-manifest',(Join-Path $PWD 'release/release-manifest.json'),'--installation-root',$installation)
          if ($LASTEXITCODE -ne 0) { throw 'Packaged update preparation failed' }
          & .\scripts\run_test_with_timeout.ps1 -Executable (Join-Path $candidate.FullName 'CreatorLoop/CreatorLoop.exe') -TimeoutSeconds 60 -CommandArgs @('--smoke')
          if ($LASTEXITCODE -ne 0) { throw 'Staged candidate launcher/schema smoke failed' }
          $healthLog = Get-ChildItem .local-test-logs -Directory | Sort-Object Name -Descending | Select-Object -First 1
          Copy-Item -LiteralPath $healthLog.FullName -Destination release/staged-health-log -Recurse
          $ownedHealth = Join-Path $PWD '.local-test-logs/candidate-owned-health'
          & .\scripts\run_test_with_timeout.ps1 -Executable python -TimeoutSeconds 120 -CommandArgs @('scripts/check_candidate_health.py','--executable',(Join-Path $candidate.FullName 'CreatorLoop/CreatorLoop.exe'),'--data-root',$env:CREATOR_LOOP_DATA_ROOT,'--log-directory',$ownedHealth,'--component-version','${{ github.sha }}')
          if ($LASTEXITCODE -ne 0) { throw 'Owned read-only candidate health failed' }
          Copy-Item -LiteralPath $ownedHealth -Destination release/candidate-owned-health -Recurse
          if ($before -ne (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()) { throw 'ZIP changed during staging' }
          "$before  CreatorLoop-${{ github.sha }}-win-x64.zip" | Set-Content -Encoding ascii release/SHA256SUMS.txt
      - name: Preserve bounded staging logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (Node 24)
        with:
          name: creator-loop-staging-test-logs-${{ github.sha }}
          path: .local-test-logs/
          if-no-files-found: error
          include-hidden-files: true
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (Node 24)
        with:
          name: creator-loop-windows-${{ github.sha }}
          path: release/*
          if-no-files-found: error
  release:
    name: publish-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fast, security, windows-artifact]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node 24)
        with:
          fetch-depth: 0
      - name: Verify tag commit is reachable from main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/download-artifact@0d2ec9d4cbcefe257d822f108de2a1f15f8da9f6 # v7.0.0 (Node 24)
        with:
          name: creator-loop-windows-${{ github.sha }}
          path: release
      - name: Verify ZIP against manifest
        run: |
          cd release
          sha256sum -c SHA256SUMS.txt
      - name: Publish tested bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes
