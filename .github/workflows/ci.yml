name: Creator Loop CI
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  fast:
    name: fast-schema-domain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node 24)
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0 (Node 24)
        with:
          python-version: '3.12'
      - name: Install pinned quality tools
        run: python -m pip install ruff==0.16.9 mypy==2.3.1
      - name: Lint, format, type check
        run: |
          ruff check app tests scripts
          ruff format --check app tests scripts
          mypy app/creator_loop
      - name: Compile and test
        env:
          PYTHONPATH: app
        run: |
          python -m compileall -q app tests
          python -m unittest discover -s tests -v
      - name: Source smoke
        env:
          PYTHONPATH: app
          CREATOR_LOOP_DATA_ROOT: ${{ runner.temp }}/creator-loop-smoke
        run: |
          python -m creator_loop --smoke
          python -m creator_loop --backup
  security:
    name: security-dependencies-workflow
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node 24)
        with:
          fetch-depth: 0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0 (Node 24)
        with:
          python-version: '3.12'
      - name: Audit packaged dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r requirements-release.txt
      - name: Check workflow policy
        run: python scripts/check_workflow_policy.py
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.24.11'
          cache: false
      - name: Scan full Git history for secrets
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" git --redact --log-opts='--all' .
  windows-artifact:
    name: windows-artifact
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node 24)
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0 (Node 24)
        with:
          python-version: '3.12'
      - name: Install pinned packaging dependencies
        run: python -m pip install -r requirements-release.txt
      - name: Tests on Windows
        env:
          PYTHONPATH: app
        shell: powershell
        timeout-minutes: 13
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\run_test_with_timeout.ps1 -Executable python -TimeoutSeconds 720 -CommandArgs @('-u','scripts/run_suite_with_diagnostics.py')
          $testExit = $LASTEXITCODE
          $run = Get-ChildItem .local-test-logs -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'result.json') } | Sort-Object Name -Descending | Select-Object -First 1
          if ($run) {
            Get-Content (Join-Path $run.FullName 'result.json')
            Get-Content (Join-Path $run.FullName 'output.log') -Tail 60
          }
          exit $testExit
      - name: Preserve bounded test logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (Node 24)
        with:
          name: creator-loop-windows-test-logs-${{ github.sha }}
          path: .local-test-logs/
          if-no-files-found: error
          include-hidden-files: true
      - name: Build one-directory application
        run: python -m PyInstaller --noconfirm --clean --onedir --name CreatorLoop --paths app --add-data "migrations/0001_initial.sql;migrations" --add-data "migrations/0002_claim_citation_seal.sql;migrations" --add-data "migrations/0003_draft_snapshot_seal.sql;migrations" --add-data "migrations/0004_selection_snapshot_seal.sql;migrations" --add-data "migrations/0005_publication_snapshot_guards.sql;migrations" --add-data "migrations/0006_observation_metric_validation.sql;migrations" packaging/entrypoint.py
      - name: Add offline product guidance before packaging
        run: python scripts/package_product_docs.py --package dist/CreatorLoop --commit '${{ github.sha }}'
      - name: Pack and smoke the exact ZIP
        shell: pwsh
        timeout-minutes: 48
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path dist/CreatorLoop -DestinationPath release/CreatorLoop-${{ github.sha }}-win-x64.zip
          $zip = (Resolve-Path release/CreatorLoop-${{ github.sha }}-win-x64.zip).Path
          $before = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $target = Join-Path $env:RUNNER_TEMP 'thư mục thử có dấu'
          Expand-Archive -Path $zip -DestinationPath $target
          $env:CREATOR_LOOP_DATA_ROOT = Join-Path $env:RUNNER_TEMP 'dữ liệu người dùng'
          & .\scripts\run_test_with_timeout.ps1 -Executable (Join-Path $target 'CreatorLoop/CreatorLoop.exe') -TimeoutSeconds 60 -CommandArgs @('--smoke')
          if ($LASTEXITCODE -ne 0) { throw 'Extracted artifact smoke failed' }
          & .\scripts\run_test_with_timeout.ps1 -Executable (Join-Path $target 'CreatorLoop/CreatorLoop.exe') -TimeoutSeconds 120 -CommandArgs @('--backup')
          if ($LASTEXITCODE -ne 0) { throw 'Extracted artifact backup failed' }
          $env:QT_QPA_PLATFORM = 'offscreen'
          & .\scripts\run_test_with_timeout.ps1 -Executable (Join-Path $target 'CreatorLoop/CreatorLoop.exe') -TimeoutSeconds 60 -CommandArgs @('--ui-smoke')
          if ($LASTEXITCODE -ne 0) { throw 'Extracted UI smoke failed' }
          $productFlow = Join-Path $env:RUNNER_TEMP 'luồng sản phẩm Qt exact'
          & .\scripts\run_test_with_timeout.ps1 -Executable python -TimeoutSeconds 180 -CommandArgs @('scripts/check_product_flow.py','--executable',(Join-Path $target 'CreatorLoop/CreatorLoop.exe'),'--work-root',$productFlow)
          if ($LASTEXITCODE -ne 0) { throw 'Exact packaged Qt product flow failed' }
          $after = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($before -ne $after) { throw 'Release ZIP changed after smoke' }
          python scripts/write_release_manifest.py --zip $zip --package (Join-Path $target 'CreatorLoop') --output release/release-manifest.json --commit '${{ github.sha }}' --run-url '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          if ($LASTEXITCODE -ne 0) { throw 'Release manifest validation failed' }
          $installation = Join-Path $env:RUNNER_TEMP 'bản cài đặt theo phiên bản'
          New-Item -ItemType Directory -Force $installation | Out-Null
          & .\scripts\run_test_with_timeout.ps1 -Executable (Join-Path $target 'CreatorLoop/CreatorLoop.exe') -TimeoutSeconds 120 -CommandArgs @('--stage-update',$zip,'--release-manifest',(Join-Path $PWD 'release/release-manifest.json'),'--installation-root',$installation)
          if ($LASTEXITCODE -ne 0) { throw 'Extracted staging command failed' }
          $candidate = Get-ChildItem $installation -Directory | Select-Object -First 1
          if (-not $candidate) { throw 'Verified candidate missing' }
          & .\scripts\run_test_with_timeout.ps1 -Executable (Join-Path $candidate.FullName 'CreatorLoop/CreatorLoop.exe') -TimeoutSeconds 120 -CommandArgs @('--prepare-update',$zip,'--release-manifest',(Join-Path $PWD 'release/release-manifest.json'),'--installation-root',$installation)
          if ($LASTEXITCODE -ne 0) { throw 'Packaged update preparation failed' }
          & .\scripts\run_test_with_timeout.ps1 -Executable (Join-Path $candidate.FullName 'CreatorLoop/CreatorLoop.exe') -TimeoutSeconds 60 -CommandArgs @('--smoke')
          if ($LASTEXITCODE -ne 0) { throw 'Staged candidate launcher/schema smoke failed' }
          $healthLog = Get-ChildItem .local-test-logs -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'result.json') } | Sort-Object Name -Descending | Select-Object -First 1
          Copy-Item -LiteralPath $healthLog.FullName -Destination release/staged-health-log -Recurse
          $ownedHealth = Join-Path $PWD '.local-test-logs/candidate-owned-health'
          & .\scripts\run_test_with_timeout.ps1 -Executable python -TimeoutSeconds 120 -CommandArgs @('scripts/check_candidate_health.py','--executable',(Join-Path $candidate.FullName 'CreatorLoop/CreatorLoop.exe'),'--data-root',$env:CREATOR_LOOP_DATA_ROOT,'--log-directory',$ownedHealth,'--component-version','${{ github.sha }}')
          if ($LASTEXITCODE -ne 0) { throw 'Owned read-only candidate health failed' }
          Copy-Item -LiteralPath $ownedHealth -Destination release/candidate-owned-health -Recurse
          $preparedJournal = Get-ChildItem (Join-Path $env:CREATOR_LOOP_DATA_ROOT 'manifests') -Filter 'update-*.json' | Select-Object -First 1
          if (-not $preparedJournal) { throw 'Prepared update journal missing' }
          & .\scripts\run_test_with_timeout.ps1 -Executable (Join-Path $candidate.FullName 'CreatorLoop/CreatorLoop.exe') -TimeoutSeconds 120 -CommandArgs @('--activate-update',$preparedJournal.FullName,'--installation-root',$installation)
          if ($LASTEXITCODE -ne 0) { throw 'Packaged prepared activation/health failed' }
          $activePointer = Get-Content (Join-Path $installation 'active-installation.json') -Raw | ConvertFrom-Json
          if ($activePointer.status -ne 'ACTIVE') { throw 'Candidate activation not health-validated' }
          $activated = Get-Content $preparedJournal.FullName -Raw | ConvertFrom-Json
          $userManifestPath = Join-Path $env:CREATOR_LOOP_DATA_ROOT 'manifests/storage-roots.json'
          $userManifest = Get-Content $userManifestPath -Raw | ConvertFrom-Json
          if ($userManifest.data_root_id -notmatch '^[0-9a-f]{32}$' -or $userManifest.last_backup_id -ne $activated.backup_id -or $userManifest.last_successful_update.update_id -ne $activated.update_id) { throw 'Successful update metadata missing or mismatched' }
          & .\scripts\run_test_with_timeout.ps1 -Executable (Join-Path $candidate.FullName 'CreatorLoop/CreatorLoop.exe') -TimeoutSeconds 120 -CommandArgs @('--repair-update-metadata',$preparedJournal.FullName,'--installation-root',$installation)
          if ($LASTEXITCODE -ne 0) { throw 'Packaged metadata recheck/repair failed' }
          $repairedManifest = Get-Content $userManifestPath -Raw | ConvertFrom-Json
          if ($repairedManifest.data_root_id -ne $userManifest.data_root_id) { throw 'Metadata repair changed data-root identity' }
          & .\scripts\run_test_with_timeout.ps1 -Executable python -TimeoutSeconds 240 -CommandArgs @('scripts/check_update_recovery.py','--executable',(Join-Path $candidate.FullName 'CreatorLoop/CreatorLoop.exe'),'--data-root',$env:CREATOR_LOOP_DATA_ROOT,'--journal',$preparedJournal.FullName,'--installation-root',$installation)
          if ($LASTEXITCODE -ne 0) { throw 'Packaged actual-state update recovery failed' }
          & .\scripts\run_test_with_timeout.ps1 -Executable python -TimeoutSeconds 300 -CommandArgs @('scripts/check_restore_assessment.py','--executable',(Join-Path $candidate.FullName 'CreatorLoop/CreatorLoop.exe'),'--data-root',$env:CREATOR_LOOP_DATA_ROOT,'--journal',$preparedJournal.FullName,'--installation-root',$installation)
          if ($LASTEXITCODE -ne 0) { throw 'Packaged restore/media assessment failed' }
          $damagedAssessment = Join-Path $env:RUNNER_TEMP 'đánh giá nguồn hỏng riêng'
          & .\scripts\run_test_with_timeout.ps1 -Executable python -TimeoutSeconds 180 -CommandArgs @('scripts/check_corrupt_restore_assessment.py','--executable',(Join-Path $candidate.FullName 'CreatorLoop/CreatorLoop.exe'),'--data-root',$env:CREATOR_LOOP_DATA_ROOT,'--journal',$preparedJournal.FullName,'--installation-root',$installation,'--work-root',$damagedAssessment)
          if ($LASTEXITCODE -ne 0) { throw 'Packaged damaged-source readonly assessment failed' }
          & .\scripts\run_test_with_timeout.ps1 -Executable python -TimeoutSeconds 360 -CommandArgs @('scripts/check_corrupt_copy_recovery.py','--executable',(Join-Path $candidate.FullName 'CreatorLoop/CreatorLoop.exe'),'--data-root',$damagedAssessment,'--installation-root',$installation,'--maintenance-ui')
          if ($LASTEXITCODE -ne 0) { throw 'Packaged corrupt-copy recovery and fresh native health failed' }
          $initialDamagedUI = Join-Path $env:RUNNER_TEMP 'Creator Loop initial damaged source UI'
          & .\scripts\run_test_with_timeout.ps1 -Executable python -TimeoutSeconds 360 -CommandArgs @('scripts/check_damaged_restore_maintenance.py','--executable',(Join-Path $candidate.FullName 'CreatorLoop/CreatorLoop.exe'),'--data-root',$env:CREATOR_LOOP_DATA_ROOT,'--journal',$preparedJournal.FullName,'--installation-root',$installation,'--work-root',$initialDamagedUI)
          if ($LASTEXITCODE -ne 0) { throw 'Initial source Qt to exact candidate damaged-source workflow failed' }
          $completedCopyProbe = Join-Path $env:RUNNER_TEMP 'Creator Loop changed completed copy refusal'
          & .\scripts\run_test_with_timeout.ps1 -Executable python -TimeoutSeconds 360 -CommandArgs @('scripts/check_completed_copy_refusal.py','--executable',(Join-Path $candidate.FullName 'CreatorLoop/CreatorLoop.exe'),'--data-root',$env:CREATOR_LOOP_DATA_ROOT,'--journal',$preparedJournal.FullName,'--installation-root',$installation,'--work-root',$completedCopyProbe)
          if ($LASTEXITCODE -ne 0) { throw 'Exact candidate completed-copy fresh-decision refusal failed' }
          $freshCopyProbe = Join-Path $env:RUNNER_TEMP 'Creator Loop explicit fresh completed restore'
          & .\scripts\run_test_with_timeout.ps1 -Executable python -TimeoutSeconds 360 -CommandArgs @('scripts/check_fresh_restore.py','--executable',(Join-Path $candidate.FullName 'CreatorLoop/CreatorLoop.exe'),'--data-root',$env:CREATOR_LOOP_DATA_ROOT,'--journal',$preparedJournal.FullName,'--installation-root',$installation,'--work-root',$freshCopyProbe,'--maintenance-ui')
          if ($LASTEXITCODE -ne 0) { throw 'Exact candidate distinct fresh restore/native retention/owned health failed' }
          $copyResumeProbe = Join-Path $env:RUNNER_TEMP 'Creator Loop interrupted copy resume'
          & .\scripts\run_test_with_timeout.ps1 -Executable python -TimeoutSeconds 360 -CommandArgs @('scripts/check_corrupt_copy_resume.py','--executable',(Join-Path $candidate.FullName 'CreatorLoop/CreatorLoop.exe'),'--data-root',$env:CREATOR_LOOP_DATA_ROOT,'--journal',$preparedJournal.FullName,'--installation-root',$installation,'--work-root',$copyResumeProbe)
          if ($LASTEXITCODE -ne 0) { throw 'Actual interrupted source-copy and exact candidate continuation failed' }
          $unknownCopyProbe = Join-Path $env:RUNNER_TEMP 'Creator Loop unknown partial bundle'
          & .\scripts\run_test_with_timeout.ps1 -Executable python -TimeoutSeconds 360 -CommandArgs @('scripts/check_corrupt_copy_resume.py','--executable',(Join-Path $candidate.FullName 'CreatorLoop/CreatorLoop.exe'),'--data-root',$env:CREATOR_LOOP_DATA_ROOT,'--journal',$preparedJournal.FullName,'--installation-root',$installation,'--work-root',$unknownCopyProbe,'--unknown-partial')
          if ($LASTEXITCODE -ne 0) { throw 'Exact candidate unknown partial bundle retention and guarded continuation failed' }
          & .\scripts\run_test_with_timeout.ps1 -Executable python -TimeoutSeconds 360 -CommandArgs @('scripts/check_restore_apply.py','--executable',(Join-Path $candidate.FullName 'CreatorLoop/CreatorLoop.exe'),'--data-root',$env:CREATOR_LOOP_DATA_ROOT,'--journal',$preparedJournal.FullName,'--installation-root',$installation)
          if ($LASTEXITCODE -ne 0) { throw 'Packaged confirmed restore and fresh health failed' }
          Copy-Item -LiteralPath $userManifestPath -Destination release/test-user-data-manifest.json
          Copy-Item -LiteralPath $preparedJournal.FullName -Destination release/activated-update-journal.json
          Copy-Item -LiteralPath (Join-Path $env:CREATOR_LOOP_DATA_ROOT 'manifests') -Destination release/restore-coordination-fixture -Recurse
          Copy-Item -LiteralPath (Join-Path $env:CREATOR_LOOP_DATA_ROOT 'logs') -Destination release/update-health-logs -Recurse
          & .\scripts\run_test_with_timeout.ps1 -Executable (Join-Path $candidate.FullName 'CreatorLoop/CreatorLoop.exe') -TimeoutSeconds 120 -CommandArgs @('--launch-managed','--installation-root',$installation,'--smoke')
          if ($LASTEXITCODE -ne 0) { throw 'Managed exact candidate schema launch failed' }
          & .\scripts\run_test_with_timeout.ps1 -Executable (Join-Path $candidate.FullName 'CreatorLoop/CreatorLoop.exe') -TimeoutSeconds 120 -CommandArgs @('--launch-managed','--installation-root',$installation,'--ui-smoke')
          if ($LASTEXITCODE -ne 0) { throw 'Managed exact candidate desktop launch failed' }
          & .\scripts\run_test_with_timeout.ps1 -Executable (Join-Path $candidate.FullName 'CreatorLoop/CreatorLoop.exe') -TimeoutSeconds 120 -CommandArgs @('--maintenance','--ui-smoke','--installation-root',$installation)
          if ($LASTEXITCODE -ne 0) { throw 'Exact candidate maintenance desktop launch failed' }
          $decoderProbe = Join-Path $PWD '.local-test-logs/exact-decoder-${{ github.sha }}'
          & .\scripts\run_test_with_timeout.ps1 -Executable python -TimeoutSeconds 90 -CommandArgs @('scripts/check_decoder_lifecycle.py','--executable',(Join-Path $candidate.FullName 'CreatorLoop/CreatorLoop.exe'),'--work-root',$decoderProbe,'--component-version','${{ github.sha }}')
          if ($LASTEXITCODE -ne 0) { throw 'Exact candidate inherited-handle decoder failed' }
          $playbackProbe = Join-Path $PWD '.local-test-logs/exact-playback-${{ github.sha }}'
          & .\scripts\run_test_with_timeout.ps1 -Executable python -TimeoutSeconds 90 -CommandArgs @('scripts/check_playback_lifecycle.py','--executable',(Join-Path $candidate.FullName 'CreatorLoop/CreatorLoop.exe'),'--work-root',$playbackProbe)
          if ($LASTEXITCODE -ne 0) { throw 'Exact candidate actual-frame/audio playback lifecycle failed' }
          $componentProbe = Join-Path $PWD '.local-test-logs/exact-components-${{ github.sha }}'
          & .\scripts\run_test_with_timeout.ps1 -Executable python -TimeoutSeconds 90 -CommandArgs @('scripts/check_local_components.py','--executable',(Join-Path $candidate.FullName 'CreatorLoop/CreatorLoop.exe'),'--work-root',$componentProbe)
          if ($LASTEXITCODE -ne 0) { throw 'Exact candidate local component artifact preflight failed' }
          $processingProbe = Join-Path $PWD '.local-test-logs/exact-processing-${{ github.sha }}'
          & .\scripts\run_test_with_timeout.ps1 -Executable python -TimeoutSeconds 120 -CommandArgs @('scripts/check_processing_recovery.py','--executable',(Join-Path $candidate.FullName 'CreatorLoop/CreatorLoop.exe'),'--work-root',$processingProbe,'--component-version','${{ github.sha }}')
          if ($LASTEXITCODE -ne 0) { throw 'Exact candidate processing/runtime startup recovery failed' }
          Copy-Item -LiteralPath (Join-Path $env:CREATOR_LOOP_DATA_ROOT 'logs') -Destination release/managed-launch-logs -Recurse
          if ($before -ne (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()) { throw 'ZIP changed during staging' }
          "$before  CreatorLoop-${{ github.sha }}-win-x64.zip" | Set-Content -Encoding ascii release/SHA256SUMS.txt
      - name: Preserve bounded staging logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (Node 24)
        with:
          name: creator-loop-staging-test-logs-${{ github.sha }}
          path: .local-test-logs/
          if-no-files-found: error
          include-hidden-files: true
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (Node 24)
        with:
          name: creator-loop-windows-${{ github.sha }}
          path: release/*
          if-no-files-found: error
  release:
    name: publish-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fast, security, windows-artifact]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node 24)
        with:
          fetch-depth: 0
      - name: Verify tag commit is reachable from main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/download-artifact@0d2ec9d4cbcefe257d822f108de2a1f15f8da9f6 # v7.0.0 (Node 24)
        with:
          name: creator-loop-windows-${{ github.sha }}
          path: release
      - name: Verify ZIP against manifest
        run: |
          cd release
          sha256sum -c SHA256SUMS.txt
      - name: Publish tested bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes
